<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prezzi Carte">
<meta name="theme-color" content="#0b1020">
<title>Cardmarket Ledger</title>
<style>
  :root {
    --inchiostro: #0b1020;
    --pergamena: #141b31;
    --pergamena-alta: #1c2440;
    --oro: #c9a35f;
    --oro-chiaro: #e5c584;
    --testo: #ece7da;
    --tenue: #828ca6;
    --sale: #5fae9d;
    --scende: #cd7159;
    --filo: rgba(201, 163, 95, 0.22);
    --bordo: rgba(255, 255, 255, 0.07);
    --larghezza-tessera: 172px;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--inchiostro);
    color: var(--testo);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    font-size: 16px;
    line-height: 1.5;
    padding-bottom: 60px;
  }

  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

  .sans { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  .guscio { max-width: 1220px; margin: 0 auto; padding: 0 22px; }

  :focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }

  /* ------------------------------------------------------------ testata */

  .testata {
    border-bottom: 1px solid var(--filo);
    padding: max(26px, env(safe-area-inset-top)) 0 22px;
    margin-bottom: 26px;
  }

  .testata-riga {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
  }

  h1 { font-size: 21px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }

  .aggiornato {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 12.5px; color: var(--tenue);
  }
  .aggiornato .cache { color: var(--oro); }

  .pannello-totale { display: none; grid-template-columns: minmax(240px, 320px) 1fr; gap: 34px; align-items: start; }

  .etichetta { font-size: 14px; color: var(--oro); margin-bottom: 6px; }

  .valore { font-size: 44px; font-weight: 600; line-height: 1; letter-spacing: -0.015em; }

  .delta { margin-top: 10px; font-size: 15px; }
  .delta.su { color: var(--sale); }
  .delta.giu { color: var(--scende); }
  .delta.pari { color: var(--tenue); }

  .nota {
    margin-top: 8px; font-size: 12.5px; color: var(--tenue); max-width: 40ch;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .chip-fila { display: flex; gap: 8px; flex-wrap: wrap; }

  .chip {
    background: none; color: var(--tenue); cursor: pointer;
    border: 1px solid var(--bordo); border-radius: 2px;
    padding: 4px 11px; font-size: 12.5px;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .chip:hover { color: var(--testo); }
  .chip.attivo { color: var(--inchiostro); background: var(--oro); border-color: var(--oro); }

  #graficoTotale { margin-top: 12px; }
  #graficoTotale svg { display: block; width: 100%; height: 132px; }

  .legenda {
    display: flex; justify-content: space-between; gap: 10px; margin-top: 6px;
    font-size: 12px; color: var(--tenue);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* ------------------------------------------- movimenti importanti */

  .movimenti { display: none; margin-bottom: 26px; }

  .movimenti-titolo { font-size: 15px; color: var(--oro); margin-bottom: 12px; }

  .movimenti-fila { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }

  .mov {
    display: flex; align-items: center; gap: 10px; flex: 0 0 auto;
    background: var(--pergamena); border: 1px solid var(--bordo);
    border-left: 2px solid var(--oro); border-radius: 3px;
    padding: 8px 14px 8px 8px; cursor: pointer; text-align: left;
    color: var(--testo); font-family: inherit; font-size: 14px;
  }
  .mov:hover { background: var(--pergamena-alta); }
  .mov img { width: 32px; height: 45px; object-fit: cover; border-radius: 2px; background: var(--pergamena-alta); }
  .mov .mov-nome { display: block; max-width: 20ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mov .mov-pct { display: block; font-size: 13px;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .mov.su { border-left-color: var(--sale); }
  .mov.giu { border-left-color: var(--scende); }

  .su { color: var(--sale); }
  .giu { color: var(--scende); }
  .pari { color: var(--tenue); }

  /* ------------------------------------------------------- ordinamento */

  .barra {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; flex-wrap: wrap; margin-bottom: 18px;
  }
  .barra .conteggio { font-size: 13px; color: var(--tenue);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  /* ------------------------------------------------------------ griglia */

  .griglia {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--larghezza-tessera), 1fr));
    gap: 30px 18px;
  }

  .tessera {
    display: block; width: 100%; padding: 0; text-align: left;
    background: none; border: none; color: inherit; font: inherit; cursor: pointer;
  }

  .cornice {
    position: relative; background: var(--pergamena);
    border: 1px solid var(--bordo); border-radius: 3px;
    padding: 9px 9px 0; overflow: hidden;
  }
  .tessera:hover .cornice { border-color: rgba(201, 163, 95, 0.45); }

  .cornice img, .cornice .segnaposto {
    display: block; width: 100%; aspect-ratio: 5 / 7;
    border-radius: 2px; background: var(--pergamena-alta);
    object-fit: contain;
  }
  .cornice .segnaposto {
    display: flex; align-items: center; justify-content: center;
    color: var(--tenue); font-size: 26px;
  }
  .tessera.spenta .cornice img { opacity: 0.42; filter: saturate(0.4); }

  .cornice .spark { display: block; width: calc(100% + 18px); height: 34px; margin: 8px 0 0 -9px; }
  .cornice .spark-vuoto { height: 34px; margin-top: 8px; }

  .segno {
    position: absolute; top: 15px; border-radius: 2px; padding: 1px 7px;
    font-size: 11.5px; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .segno.grado { left: 15px; background: rgba(201, 163, 95, 0.92); color: #16110a; font-weight: 600; }
  .segno.qta { right: 15px; background: rgba(11, 16, 32, 0.86); border: 1px solid var(--filo); color: var(--oro-chiaro); }
  .segno.stato { left: 15px; background: rgba(11, 16, 32, 0.9); border: 1px solid var(--bordo); color: var(--tenue); }

  .piede { padding: 10px 2px 0; }
  .piede .nome { font-size: 14.5px; line-height: 1.25; min-height: 2.5em; }
  .piede .riga-prezzo { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 5px; }
  .piede .prezzo { font-size: 21px; font-weight: 600; }
  .piede .prezzo.stimato { color: var(--tenue); }
  .piede .var { font-size: 13px; white-space: nowrap;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  .tessera.forte .cornice { border-color: rgba(201, 163, 95, 0.6); box-shadow: 0 0 0 1px rgba(201, 163, 95, 0.16); }

  @keyframes lampo {
    0%, 100% { box-shadow: 0 0 0 1px rgba(201, 163, 95, 0); }
    30% { box-shadow: 0 0 0 3px rgba(201, 163, 95, 0.55); }
  }
  .tessera.lampeggia .cornice { animation: lampo 1.1s ease-in-out 2; }

  /* ---------------------------------------------------- scheda grande */

  .velo {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(5, 8, 18, 0.82);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 20px; overflow-y: auto;
  }
  .velo[hidden] { display: none; }

  .scheda {
    position: relative; width: 100%; max-width: 880px;
    background: var(--pergamena); border: 1px solid var(--filo); border-radius: 4px;
    padding: 30px 32px 32px;
    display: grid; grid-template-columns: 250px 1fr; gap: 32px; align-items: start;
  }

  .scheda-img { width: 100%; border-radius: 4px; display: block;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5); background: var(--pergamena-alta); }

  .scheda h2 { font-size: 26px; font-weight: 600; margin: 0 0 6px; }
  .scheda .prezzo-grande { font-size: 44px; font-weight: 600; line-height: 1; margin: 20px 0 8px; }
  .scheda .sotto { font-size: 14px; }

  .fatti { display: flex; flex-wrap: wrap; gap: 22px 30px; margin: 22px 0 24px; }
  .fatti div { font-size: 12.5px; color: var(--tenue);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .fatti b { display: block; margin-top: 2px; font-size: 17px; font-weight: 600; color: var(--testo);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; }

  .scheda .grafico-grande svg { display: block; width: 100%; height: 140px; }

  .scheda .apri {
    display: inline-block; margin-top: 20px; font-size: 13.5px;
    color: var(--oro-chiaro); text-decoration: none;
    border-bottom: 1px solid var(--filo); padding-bottom: 2px;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .scheda .apri:hover { border-color: var(--oro); }

  .chiudi {
    position: absolute; top: 12px; right: 14px;
    background: none; border: none; color: var(--tenue);
    font-size: 26px; line-height: 1; cursor: pointer; padding: 4px 8px;
  }
  .chiudi:hover { color: var(--testo); }

  /* -------------------------------------------------- stati e attese */

  .sk { display: none; }
  .sk .cornice { height: 268px; }
  @keyframes respiro { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.6; } }
  .sk .cornice { animation: respiro 1.6s ease-in-out infinite; }

  .avviso {
    display: none; margin: 40px 0; padding: 22px;
    border: 1px dashed var(--bordo); border-radius: 3px;
    color: var(--tenue); text-align: center; font-size: 15px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  @media (max-width: 900px) {
    .pannello-totale { grid-template-columns: 1fr; gap: 24px; }
    .scheda { grid-template-columns: 1fr; gap: 24px; padding: 26px 20px 28px; }
    .scheda-img { max-width: 240px; margin: 0 auto; }
  }

  @media (max-width: 420px) {
    .guscio { padding: 0 14px; }
    .griglia { grid-template-columns: 1fr 1fr; gap: 22px 12px; }
    .valore { font-size: 36px; }
    .velo { padding: 0; }
    .scheda { border: none; border-radius: 0; min-height: 100%; }
  }
</style>
</head>
<body>

<div class="guscio">

  <header class="testata">
    <div class="testata-riga">
      <h1>Cardmarket Ledger</h1>
      <div class="aggiornato" id="aggiornato">caricamento…</div>
    </div>

    <div class="pannello-totale" id="totale">
      <div>
        <div class="etichetta">Valore della collezione</div>
        <div class="valore num" id="totaleValore"></div>
        <div class="delta" id="totaleDelta"></div>
        <div class="nota" id="notaStima"></div>
      </div>
      <div>
        <div class="chip-fila" id="periodi"></div>
        <div id="graficoTotale"></div>
        <div class="legenda" id="graficoTotaleLeg"></div>
      </div>
    </div>
  </header>

  <section class="movimenti" id="movimenti"></section>

  <div class="barra">
    <div class="conteggio" id="conteggio"></div>
    <div class="chip-fila" id="ordina"></div>
  </div>

  <div class="griglia sk" id="scheletro"></div>
  <div class="griglia" id="griglia"></div>

  <div class="avviso" id="vuoto">
    Nessuna carta in elenco. Aggiungine una dall'estensione sul PC e sincronizza.
  </div>
  <div class="avviso" id="errore">
    Il file data.json non si carica. Lancia una sincronizzazione dall'estensione.
  </div>

</div>

<div class="velo" id="velo" hidden>
  <div class="scheda" id="scheda" role="dialog" aria-modal="true" aria-label="Dettaglio carta"></div>
</div>

<script>
// ---------------------------------------------------------------------------
// Costanti
// ---------------------------------------------------------------------------

// Record dello storico distanti meno di questo intervallo appartengono allo
// stesso controllo: l'estensione legge le carte una alla volta, quindi un
// singolo giro produce decine di timestamp diversi.
var GAP_SESSIONE = 30 * 60 * 1000;

// Soglia (in %) oltre la quale un movimento è considerato "importante".
var SOGLIA_FORTE = 15;

// Le immagini in data.json sono salvate a 160x224 px: è il tetto di nitidezza.
// Mettendo true, la pagina prova a caricare l'immagine grande da immagineUrl
// (S3 di Cardmarket) e, se la richiesta fallisce, resta quella incorporata.
var IMMAGINI_HD = false;

var CHIAVE_CACHE = 'ledger:data';
var CHIAVE_ORDINE = 'ledger:ordine';

var PERIODI = [
  { id: '7g', etichetta: '7 giorni', giorni: 7 },
  { id: '30g', etichetta: '30 giorni', giorni: 30 },
  { id: 'tutto', etichetta: 'tutto', giorni: null }
];

var ORDINAMENTI = [
  { id: 'lista', etichetta: 'lista' },
  { id: 'valore', etichetta: 'valore' },
  { id: 'variazione', etichetta: 'variazione' },
  { id: 'nome', etichetta: 'nome' }
];

var stato = {
  dati: null,
  indice: null,
  periodo: 'tutto',
  ordine: leggi(CHIAVE_ORDINE) || 'lista',
  puntiTotale: []
};

// ---------------------------------------------------------------------------
// Avvio: prima la cache locale (istantanea), poi la rete
// ---------------------------------------------------------------------------

var testoCache = leggi(CHIAVE_CACHE);
var mostrataCache = false;

if (testoCache) {
  try {
    render(JSON.parse(testoCache), true);
    mostrataCache = true;
  } catch (e) {
    scrivi(CHIAVE_CACHE, null);
  }
}

if (!mostrataCache) mostraScheletro();

// Niente cache-buster: con una richiesta rivalidata GitHub Pages risponde 304
// (senza corpo) quando data.json non è cambiato, invece di rispedire tutto.
fetch('data.json', { cache: 'no-cache' })
  .then(function (r) {
    if (!r.ok) throw new Error('http ' + r.status);
    return r.text();
  })
  .then(function (testo) {
    var dati = JSON.parse(testo);
    if (!mostrataCache || testo !== testoCache) {
      scrivi(CHIAVE_CACHE, testo);
      render(dati, false);
    } else {
      segnaFreschezza(dati, false);
    }
  })
  .catch(function () {
    if (mostrataCache) {
      var el = document.getElementById('aggiornato');
      el.innerHTML = el.textContent + ' <span class="cache">· offline</span>';
    } else {
      nascondiScheletro();
      document.getElementById('aggiornato').textContent = 'nessun dato';
      document.getElementById('errore').style.display = 'block';
    }
  });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* opzionale */ });
  });
}

// ---------------------------------------------------------------------------
// Memoria locale e attese
// ---------------------------------------------------------------------------

function leggi(chiave) {
  try { return localStorage.getItem(chiave); } catch (e) { return null; }
}

function scrivi(chiave, valore) {
  try {
    if (valore === null) localStorage.removeItem(chiave);
    else localStorage.setItem(chiave, valore);
  } catch (e) { /* quota piena o storage negato: la pagina funziona lo stesso */ }
}

function mostraScheletro() {
  var sk = document.getElementById('scheletro');
  var html = '';
  for (var i = 0; i < 12; i++) html += '<div class="tessera"><div class="cornice"></div></div>';
  sk.innerHTML = html;
  sk.style.display = 'grid';
}

function nascondiScheletro() {
  var sk = document.getElementById('scheletro');
  sk.style.display = 'none';
  sk.innerHTML = '';
}

// ---------------------------------------------------------------------------
// Formattazione
// ---------------------------------------------------------------------------

function formattaData(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  return d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' }) + ' ' +
         d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
}

function formattaGiorno(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' });
}

function euro(v) { return v.toFixed(2).replace('.', ',') + ' €'; }

// Nelle tessere lo spazio è poco: sopra i 100 € i centesimi non servono.
function euroCorto(v) {
  if (Math.abs(v) >= 100) return Math.round(v).toLocaleString('it-IT') + ' €';
  return euro(v);
}

function pct(v) { return Math.abs(v).toFixed(1).replace('.', ',') + '%'; }

function testo(el, t) { el.textContent = t; return el; }

// ---------------------------------------------------------------------------
// Indicizzazione dello storico
// ---------------------------------------------------------------------------

function indicizza(storico) {
  var per = {};
  for (var i = 0; i < storico.length; i++) {
    var r = storico[i];
    if (!per[r.link]) per[r.link] = [];
    per[r.link].push(r);
  }
  Object.keys(per).forEach(function (k) {
    per[k].sort(function (a, b) { return a.data - b.data; });
  });
  return per;
}

function serieCarta(indice, carta) {
  return indice[carta.link] || [];
}

// Ultimo prezzo noto di una carta a un dato istante (ricerca binaria).
function prezzoAl(serie, t) {
  var lo = 0, hi = serie.length - 1, res = null;
  while (lo <= hi) {
    var mid = (lo + hi) >> 1;
    if (serie[mid].data <= t) { res = serie[mid].prezzo; lo = mid + 1; }
    else hi = mid - 1;
  }
  return res;
}

// Istanti di fine di ogni controllo: prendendo l'ultimo timestamp del gruppo
// il totale include tutte le carte lette in quel giro.
function fineControlli(storico) {
  var ts = [];
  for (var i = 0; i < storico.length; i++) ts.push(storico[i].data);
  ts.sort(function (a, b) { return a - b; });

  var fini = [];
  for (var j = 0; j < ts.length; j++) {
    if (j === ts.length - 1 || ts[j + 1] - ts[j] > GAP_SESSIONE) fini.push(ts[j]);
  }
  return fini;
}

// ---------------------------------------------------------------------------
// Valore della collezione
// ---------------------------------------------------------------------------

function valoreAl(carte, indice, t) {
  var tot = 0, contate = 0;
  for (var i = 0; i < carte.length; i++) {
    var c = carte[i];
    var serie = indice[c.link];
    if (!serie || !serie.length) continue;
    var p = prezzoAl(serie, t);
    if (p != null) { tot += p * (c.quantita || 1); contate++; }
  }
  return { totale: tot, contate: contate };
}

// Una carta il cui ultimo controllo è fallito non sparisce dal totale: vale il
// suo ultimo prezzo noto, segnalato come stimato.
function valoreCorrente(carte, indice) {
  var tot = 0, contate = 0, stimate = 0, mancanti = 0;
  carte.forEach(function (c) {
    var q = c.quantita || 1;
    var p = c.ultimoPrezzo;
    if (p == null) {
      var serie = indice[c.link];
      p = serie && serie.length ? serie[serie.length - 1].prezzo : null;
      if (p != null) stimate++;
    }
    if (p != null) { tot += p * q; contate++; }
    else mancanti++;
  });
  return { totale: tot, contate: contate, stimate: stimate, mancanti: mancanti };
}

function serieTotale(carte, indice, storico) {
  var punti = [];
  fineControlli(storico).forEach(function (t) {
    var v = valoreAl(carte, indice, t);
    if (v.contate > 0) punti.push({ data: t, totale: v.totale, contate: v.contate });
  });
  return punti;
}

// Confronto con il controllo precedente, contando solo le carte presenti in
// entrambi: una carta appena aggiunta non è un guadagno di mercato.
function confrontoUltimi(carte, indice, storico) {
  var fini = fineControlli(storico);
  if (fini.length < 2) return null;

  var tPrec = fini[fini.length - 2];
  var tOra = fini[fini.length - 1];
  var delta = 0, nuove = 0, valNuove = 0;

  carte.forEach(function (c) {
    var serie = indice[c.link];
    if (!serie || !serie.length) return;
    var q = c.quantita || 1;
    var prima = prezzoAl(serie, tPrec);
    var dopo = prezzoAl(serie, tOra);
    if (dopo == null) return;
    if (prima == null) { nuove++; valNuove += dopo * q; }
    else delta += (dopo - prima) * q;
  });

  return { delta: delta, nuove: nuove, valNuove: valNuove, data: tPrec };
}

// Variazione dell'ultimo prezzo rispetto a ~7 giorni prima. Con storico più
// corto confronta con il punto più vecchio e l'etichetta riporta i giorni veri.
function variazioneCarta(serie) {
  if (serie.length < 2) return null;
  var ultimo = serie[serie.length - 1];
  var soglia = ultimo.data - 7 * 86400000;

  var rif = null;
  for (var i = 0; i < serie.length; i++) {
    if (serie[i].data <= soglia) rif = serie[i];
    else break;
  }

  var etichetta = '7 giorni';
  if (!rif || rif === ultimo) {
    rif = serie[0];
    if (rif === ultimo) rif = serie[serie.length - 2];
    var giorni = Math.max(1, Math.round((ultimo.data - rif.data) / 86400000));
    etichetta = giorni === 1 ? '1 giorno' : giorni + ' giorni';
  }

  if (!rif || !rif.prezzo) return null;
  return {
    pct: ((ultimo.prezzo - rif.prezzo) / rif.prezzo) * 100,
    etichetta: etichetta,
    da: rif.data
  };
}

function classeVar(v) {
  if (!v || Math.abs(v.pct) < 0.05) return 'pari';
  return v.pct > 0 ? 'su' : 'giu';
}

function testoVar(v) {
  if (!v) return '';
  if (Math.abs(v.pct) < 0.05) return 'stabile';
  return (v.pct > 0 ? '+' : '−') + pct(v.pct);
}

// ---------------------------------------------------------------------------
// Grafici
// ---------------------------------------------------------------------------

// X proporzionale al tempo reale, non all'indice del punto: i controlli sono
// distanziati da poche ore a sei giorni.
function disegnaGrafico(punti, W, H, PAD, colore, punto) {
  var valori = punti.map(function (p) { return p.totale; });
  var min = Math.min.apply(null, valori);
  var max = Math.max.apply(null, valori);
  var range = (max - min) || 1;

  var t0 = punti[0].data;
  var tN = punti[punti.length - 1].data;
  var durata = (tN - t0) || 1;

  var pts = punti.map(function (p) {
    var x = PAD + ((p.data - t0) / durata) * (W - 2 * PAD);
    var y = H - PAD - ((p.totale - min) / range) * (H - 2 * PAD);
    return x.toFixed(1) + ',' + y.toFixed(1);
  });

  var linea = pts.join(' ');
  var area = PAD + ',' + (H - PAD) + ' ' + linea + ' ' + (W - PAD) + ',' + (H - PAD);
  var ultimo = pts[pts.length - 1].split(',');

  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<polygon points="' + area + '" fill="' + colore + '" opacity="0.12"/>' +
    '<polyline points="' + linea + '" fill="none" stroke="' + colore + '" stroke-width="2" ' +
    'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
    (punto ? '<circle cx="' + ultimo[0] + '" cy="' + ultimo[1] + '" r="2.6" fill="' + colore + '"/>' : '') +
    '</svg>';
}

function coloreVar(v) {
  if (!v || Math.abs(v.pct) < 0.05) return '#828ca6';
  return v.pct > 0 ? '#5fae9d' : '#cd7159';
}

function graficoCarta(serie, W, H, PAD, colore) {
  if (serie.length < 2) return '';
  return disegnaGrafico(serie.map(function (r) {
    return { data: r.data, totale: r.prezzo };
  }), W, H, PAD, colore, true);
}

function filtraPeriodo(punti, giorni) {
  if (!giorni || !punti.length) return punti;
  var limite = punti[punti.length - 1].data - giorni * 86400000;
  var dentro = punti.filter(function (p) { return p.data >= limite; });
  return dentro.length >= 2 ? dentro : punti;
}

function aggiornaGraficoTotale() {
  var gtEl = document.getElementById('graficoTotale');
  var gtLeg = document.getElementById('graficoTotaleLeg');
  var punti = filtraPeriodo(stato.puntiTotale, periodoAttivo().giorni);

  if (punti.length < 2) { gtEl.innerHTML = ''; gtLeg.innerHTML = ''; return; }

  gtEl.innerHTML = disegnaGrafico(punti, 520, 132, 8, '#c9a35f', false);

  var valori = punti.map(function (p) { return p.totale; });
  gtLeg.innerHTML =
    '<span>' + formattaGiorno(punti[0].data) + '</span>' +
    '<span>da ' + euro(Math.min.apply(null, valori)) + ' a ' + euro(Math.max.apply(null, valori)) + '</span>' +
    '<span>' + formattaGiorno(punti[punti.length - 1].data) + '</span>';
}

function periodoAttivo() {
  for (var i = 0; i < PERIODI.length; i++) {
    if (PERIODI[i].id === stato.periodo) return PERIODI[i];
  }
  return PERIODI[PERIODI.length - 1];
}

function costruisciChip(contenitore, voci, attivo, onScelta) {
  contenitore.innerHTML = '';
  voci.forEach(function (v) {
    var b = document.createElement('button');
    b.className = 'chip' + (v.id === attivo ? ' attivo' : '');
    b.textContent = v.etichetta;
    b.addEventListener('click', function () { onScelta(v.id); });
    contenitore.appendChild(b);
  });
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------

function segnaFreschezza(dati, daCache) {
  document.getElementById('aggiornato').innerHTML =
    'ultimo controllo: ' + (dati.aggiornatoIl ? formattaData(dati.aggiornatoIl) : 'mai') +
    (daCache ? ' <span class="cache">· in cache</span>' : '');
}

function render(dati, daCache) {
  nascondiScheletro();

  var carte = dati.carte || [];
  var storico = dati.storico || [];
  var indice = indicizza(storico);

  stato.dati = dati;
  stato.indice = indice;

  segnaFreschezza(dati, daCache);

  if (carte.length === 0) {
    document.getElementById('vuoto').style.display = 'block';
    return;
  }
  document.getElementById('vuoto').style.display = 'none';

  // --- totale ------------------------------------------------------------
  var val = valoreCorrente(carte, indice);
  stato.puntiTotale = serieTotale(carte, indice, storico);

  if (val.contate > 0) {
    document.getElementById('totale').style.display = 'grid';
    document.getElementById('totaleValore').textContent = euro(val.totale);

    var deltaEl = document.getElementById('totaleDelta');
    var conf = confrontoUltimi(carte, indice, storico);
    var note = [];

    if (conf) {
      var diff = conf.delta;
      if (Math.abs(diff) < 0.005) {
        deltaEl.textContent = 'mercato invariato dal controllo del ' + formattaGiorno(conf.data);
        deltaEl.className = 'delta pari';
      } else {
        deltaEl.textContent = (diff > 0 ? '▲ +' : '▼ −') + euro(Math.abs(diff)) +
          ' dal controllo del ' + formattaGiorno(conf.data);
        deltaEl.className = 'delta ' + (diff > 0 ? 'su' : 'giu');
      }
      if (conf.nuove) {
        note.push('+' + conf.nuove + (conf.nuove === 1 ? ' carta nuova' : ' carte nuove') +
          ' (' + euro(conf.valNuove) + ', fuori dal confronto)');
      }
    } else {
      deltaEl.textContent = 'primo controllo: nessun confronto disponibile';
      deltaEl.className = 'delta pari';
    }

    if (val.stimate) note.push(val.stimate + (val.stimate === 1 ? ' carta stimata' : ' carte stimate') + ' sull\'ultimo prezzo noto');
    if (val.mancanti) note.push(val.mancanti + (val.mancanti === 1 ? ' carta esclusa' : ' carte escluse') + ', mai rilevata');
    document.getElementById('notaStima').textContent = note.join(' · ');
  }

  var perEl = document.getElementById('periodi');
  if (stato.puntiTotale.length >= 2) {
    perEl.style.display = 'flex';
    var scegliPeriodo = function (id) {
      stato.periodo = id;
      costruisciChip(perEl, PERIODI, id, scegliPeriodo);
      aggiornaGraficoTotale();
    };
    costruisciChip(perEl, PERIODI, stato.periodo, scegliPeriodo);
  } else {
    perEl.style.display = 'none';
  }

  aggiornaGraficoTotale();

  // --- movimenti importanti ----------------------------------------------
  disegnaMovimenti(carte, indice);

  // --- conteggio e ordinamento -------------------------------------------
  document.getElementById('conteggio').textContent =
    carte.length + (carte.length === 1 ? ' carta in collezione' : ' carte in collezione');

  var ordEl = document.getElementById('ordina');
  var scegliOrdine = function (id) {
    stato.ordine = id;
    scrivi(CHIAVE_ORDINE, id);
    costruisciChip(ordEl, ORDINAMENTI, id, scegliOrdine);
    disegnaGriglia(ordinaCarte(carte, indice), indice);
  };
  costruisciChip(ordEl, ORDINAMENTI, stato.ordine, scegliOrdine);

  disegnaGriglia(ordinaCarte(carte, indice), indice);
}

function disegnaMovimenti(carte, indice) {
  var el = document.getElementById('movimenti');
  var movers = [];

  carte.forEach(function (c) {
    if (c.ultimoPrezzo == null) return;
    var v = variazioneCarta(serieCarta(indice, c));
    if (v && Math.abs(v.pct) >= SOGLIA_FORTE) movers.push({ carta: c, v: v });
  });

  if (!movers.length) { el.style.display = 'none'; el.innerHTML = ''; return; }

  movers.sort(function (a, b) { return Math.abs(b.v.pct) - Math.abs(a.v.pct); });

  el.style.display = 'block';
  el.innerHTML = '<div class="movimenti-titolo">Si sono mosse di più (oltre il ' + SOGLIA_FORTE + '%)</div>' +
    '<div class="movimenti-fila"></div>';

  var fila = el.querySelector('.movimenti-fila');

  movers.forEach(function (m) {
    var b = document.createElement('button');
    b.className = 'mov ' + classeVar(m.v);
    b.dataset.link = m.carta.link;

    if (m.carta.immagine) {
      var img = document.createElement('img');
      img.src = m.carta.immagine;
      img.alt = '';
      b.appendChild(img);
    }

    var box = document.createElement('div');
    var nome = document.createElement('span');
    nome.className = 'mov-nome';
    nome.textContent = m.carta.nome;
    var p = document.createElement('span');
    p.className = 'mov-pct ' + classeVar(m.v);
    p.textContent = testoVar(m.v) + ' in ' + m.v.etichetta;
    box.appendChild(nome);
    box.appendChild(p);
    b.appendChild(box);

    b.addEventListener('click', function () { vaiAllaTessera(m.carta.link); });
    fila.appendChild(b);
  });
}

function vaiAllaTessera(link) {
  var t = null;
  var tessere = document.querySelectorAll('.tessera');
  for (var i = 0; i < tessere.length; i++) {
    if (tessere[i].dataset.link === link) { t = tessere[i]; break; }
  }
  if (!t) return;
  t.scrollIntoView({ behavior: 'smooth', block: 'center' });
  t.classList.remove('lampeggia');
  void t.offsetWidth;
  t.classList.add('lampeggia');
}

function ordinaCarte(carte, indice) {
  var arr = carte.slice();
  if (stato.ordine === 'valore') {
    arr.sort(function (a, b) { return valoreCarta(b, indice) - valoreCarta(a, indice); });
  } else if (stato.ordine === 'variazione') {
    arr.sort(function (a, b) {
      var va = variazioneCarta(serieCarta(indice, a));
      var vb = variazioneCarta(serieCarta(indice, b));
      return Math.abs(vb ? vb.pct : 0) - Math.abs(va ? va.pct : 0);
    });
  } else if (stato.ordine === 'nome') {
    arr.sort(function (a, b) { return (a.nome || '').localeCompare(b.nome || '', 'it'); });
  }
  return arr;
}

function valoreCarta(c, indice) {
  var p = c.ultimoPrezzo;
  if (p == null) {
    var serie = indice[c.link];
    p = serie && serie.length ? serie[serie.length - 1].prezzo : 0;
  }
  return p * (c.quantita || 1);
}

// Prezzo da mostrare e stato della carta, in un posto solo: la tessera e la
// scheda grande devono raccontare la stessa cosa.
function letturaCarta(c, serie) {
  if (c.ultimoPrezzo != null) {
    return { prezzo: c.ultimoPrezzo, stimato: false, stato: null };
  }
  if (serie.length) {
    return {
      prezzo: serie[serie.length - 1].prezzo,
      stimato: true,
      stato: (c.ultimoBloccato ? 'anti-bot' : 'errore') + ', ultimo noto ' + formattaGiorno(serie[serie.length - 1].data)
    };
  }
  return {
    prezzo: null,
    stimato: false,
    stato: c.ultimoBloccato ? 'anti-bot' : (c.ultimoErrore ? 'errore' : 'mai rilevata')
  };
}

// Le immagini sono data: URI dentro data.json, quindi loading="lazy" non ha
// effetto: non c'è rete da rimandare e il browser le decodifica tutte insieme.
// Con l'observer la sorgente viene assegnata solo quando la tessera si avvicina.
var osservatore = 'IntersectionObserver' in window
  ? new IntersectionObserver(function (voci, obs) {
      voci.forEach(function (v) {
        if (!v.isIntersecting) return;
        var img = v.target;
        if (img.dataset.src) { img.src = img.dataset.src; delete img.dataset.src; }
        obs.unobserve(img);
      });
    }, { rootMargin: '600px 0px' })
  : null;

// Con IMMAGINI_HD la versione grande arriva dalla rete e sostituisce quella
// incorporata solo se il caricamento riesce: se Cardmarket blocca la richiesta
// non si vede alcun buco.
function alzaRisoluzione(img, carta) {
  if (!IMMAGINI_HD || !carta.immagineUrl) return;
  var grande = new Image();
  grande.referrerPolicy = 'no-referrer';
  grande.onload = function () { img.src = carta.immagineUrl; };
  grande.src = carta.immagineUrl;
}

function disegnaGriglia(carte, indice) {
  var griglia = document.getElementById('griglia');
  griglia.innerHTML = '';
  var frag = document.createDocumentFragment();

  carte.forEach(function (c, idx) {
    var serie = serieCarta(indice, c);
    var lettura = letturaCarta(c, serie);
    var v = c.ultimoPrezzo != null ? variazioneCarta(serie) : null;
    var forte = v && Math.abs(v.pct) >= SOGLIA_FORTE;

    var t = document.createElement('button');
    t.className = 'tessera' + (forte ? ' forte' : '') + (lettura.prezzo == null || lettura.stimato ? ' spenta' : '');
    t.dataset.link = c.link;
    t.setAttribute('aria-label', c.nome);

    var cornice = document.createElement('div');
    cornice.className = 'cornice';

    if (c.immagine) {
      var img = document.createElement('img');
      img.alt = '';
      img.referrerPolicy = 'no-referrer';
      if (idx < 12 || !osservatore) img.src = c.immagine;
      else { img.dataset.src = c.immagine; osservatore.observe(img); }
      alzaRisoluzione(img, c);
      cornice.appendChild(img);
    } else {
      var seg = document.createElement('div');
      seg.className = 'segnaposto';
      seg.textContent = '🂠';
      cornice.appendChild(seg);
    }

    if (c.filtroInfo) {
      var g = document.createElement('span');
      g.className = 'segno grado';
      g.textContent = c.filtroInfo;
      cornice.appendChild(g);
    } else if (lettura.stato) {
      var s = document.createElement('span');
      s.className = 'segno stato';
      s.textContent = c.ultimoBloccato ? 'anti-bot' : 'errore';
      cornice.appendChild(s);
    }

    if (c.quantita && c.quantita > 1) {
      var q = document.createElement('span');
      q.className = 'segno qta';
      q.textContent = '×' + c.quantita;
      cornice.appendChild(q);
    }

    var spark = graficoCarta(serie, 190, 34, 3, coloreVar(v));
    if (spark) {
      var box = document.createElement('div');
      box.innerHTML = spark;
      var svg = box.firstChild;
      svg.setAttribute('class', 'spark');
      cornice.appendChild(svg);
    } else {
      var vuoto = document.createElement('div');
      vuoto.className = 'spark-vuoto';
      cornice.appendChild(vuoto);
    }

    t.appendChild(cornice);

    var piede = document.createElement('div');
    piede.className = 'piede';

    var nome = document.createElement('div');
    nome.className = 'nome';
    nome.textContent = c.nome;
    piede.appendChild(nome);

    var riga = document.createElement('div');
    riga.className = 'riga-prezzo';

    var prezzo = document.createElement('span');
    prezzo.className = 'prezzo num' + (lettura.stimato ? ' stimato' : '');
    prezzo.textContent = lettura.prezzo == null ? '—' : euroCorto(lettura.prezzo);
    riga.appendChild(prezzo);

    var vv = document.createElement('span');
    vv.className = 'var ' + classeVar(v);
    vv.textContent = v ? testoVar(v) : '';
    riga.appendChild(vv);

    piede.appendChild(riga);
    t.appendChild(piede);

    t.addEventListener('click', function () { apriScheda(c, serie); });

    frag.appendChild(t);
  });

  griglia.appendChild(frag);
}

// ---------------------------------------------------------------------------
// Scheda grande
// ---------------------------------------------------------------------------

function apriScheda(c, serie) {
  var velo = document.getElementById('velo');
  var scheda = document.getElementById('scheda');
  var lettura = letturaCarta(c, serie);
  var v = c.ultimoPrezzo != null ? variazioneCarta(serie) : null;
  var prezzi = serie.map(function (r) { return r.prezzo; });

  var fatti = '';
  function fatto(etichetta, valore) {
    fatti += '<div>' + etichetta + '<b class="num">' + valore + '</b></div>';
  }
  if (c.quantita && c.quantita > 1) fatto('Copie', c.quantita);
  if (c.ultimeOfferte != null) fatto('Venditori italiani', c.ultimeOfferte);
  if (c.ultimaMedia3 != null) fatto('Media tre più basse', euro(c.ultimaMedia3));
  if (prezzi.length) fatto('Massimo storico', euro(Math.max.apply(null, prezzi)));
  if (prezzi.length) fatto('Minimo storico', euro(Math.min.apply(null, prezzi)));
  if (c.quantita && c.quantita > 1 && lettura.prezzo != null) {
    fatto('Valore delle copie', euro(lettura.prezzo * c.quantita));
  }

  var sotto = lettura.stato
    ? '<div class="sotto pari">' + lettura.stato + '</div>'
    : (v ? '<div class="sotto ' + classeVar(v) + '">' + testoVar(v) + ' rispetto al ' + formattaGiorno(v.da) + '</div>' : '');

  scheda.innerHTML =
    '<button class="chiudi" aria-label="Chiudi">×</button>' +
    '<img class="scheda-img" src="' + (c.immagine || '') + '" alt="' + c.nome + '">' +
    '<div>' +
      '<h2>' + c.nome + '</h2>' +
      '<div class="nota">' + (c.filtroInfo ? c.filtroInfo + ' — ' : '') +
        'prezzo minimo fra i venditori italiani, rilevato il ' + formattaData(c.ultimaData) + '</div>' +
      '<div class="prezzo-grande num">' + (lettura.prezzo == null ? '—' : euro(lettura.prezzo)) + '</div>' +
      sotto +
      '<div class="fatti">' + fatti + '</div>' +
      (serie.length >= 2
        ? '<div class="grafico-grande">' + graficoCarta(serie, 560, 140, 6, coloreVar(v)) + '</div>' +
          '<div class="legenda"><span>' + formattaGiorno(serie[0].data) + '</span>' +
          '<span>' + serie.length + ' rilevazioni</span>' +
          '<span>' + formattaGiorno(serie[serie.length - 1].data) + '</span></div>'
        : '<div class="nota">Storico troppo corto per un grafico: serve almeno un secondo controllo.</div>') +
      '<a class="apri" href="' + c.link + '" target="_blank" rel="noopener">Apri la pagina su Cardmarket</a>' +
    '</div>';

  if (IMMAGINI_HD && c.immagineUrl) alzaRisoluzione(scheda.querySelector('.scheda-img'), c);

  velo.hidden = false;
  document.body.style.overflow = 'hidden';
  scheda.querySelector('.chiudi').focus();
}

function chiudiScheda() {
  document.getElementById('velo').hidden = true;
  document.body.style.overflow = '';
}

document.getElementById('velo').addEventListener('click', function (e) {
  if (e.target.id === 'velo' || e.target.classList.contains('chiudi')) chiudiScheda();
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') chiudiScheda();
});
</script>
</body>
